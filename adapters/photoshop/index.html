<!doctype html>
<html>
<head><meta charset="UTF-8"><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <h1>PATCH</h1>
    <p id="status">Not paired</p>
    <label for="pairing">Desktop pairing code</label>
    <input id="pairing" type="password" autocomplete="off" spellcheck="false">
    <button id="pair">Pair with PATCH Desktop</button>
    <button id="forget" class="secondary">Forget pairing</button>
    <p class="note">PATCH only accepts commands from the paired local desktop app at 127.0.0.1.</p>
  </main>
  <script src="index.js"></script>
</body>
</html>
