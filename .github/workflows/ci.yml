name: PATCH CI
on:
  push:
  pull_request:

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
          run_install: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install JS dependencies
        shell: pwsh
        run: |
          if (Test-Path pnpm-lock.yaml) { pnpm install --frozen-lockfile }
          else { Write-Warning 'pnpm-lock.yaml is not present; resolving pinned direct dependencies.'; pnpm install --no-frozen-lockfile }
      - name: Source security lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build monorepo
        run: pnpm build
      - name: Build Windows UIA bridge
        run: dotnet build .\apps\windows-bridge\Patch.WindowsBridge.csproj -c Release
      - name: Package Windows installer
        run: pnpm package:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PATCH-Windows-x64
          path: release/PATCH-*-x64.exe
          if-no-files-found: error
